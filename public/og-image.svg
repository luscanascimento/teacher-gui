<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#9E2A2B"/>
  
  <!-- Subtle Union Jack overlay -->
  <g opacity="0.12">
    <path d="M0,0 L1200,630 M1200,0 L0,630" stroke="#F4F1EA" stroke-width="40"/>
    <path d="M600,0 v630 M0,315 h1200" stroke="#F4F1EA" stroke-width="80"/>
    <path d="M600,0 v630 M0,315 h1200" stroke="#1C2A39" stroke-width="50"/>
  </g>

  <!-- Editorial Card Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#F4F1EA" filter="drop-shadow(0 20px 40px rgba(28,42,57,0.3))"/>
  
  <!-- Monogram Roundel -->
  <circle cx="180" cy="180" r="50" fill="#9E2A2B"/>
  <text x="180" y="196" font-family="serif" font-size="44" font-weight="900" fill="#F4F1EA" text-anchor="middle">TG</text>

  <!-- Brand text -->
  <text x="250" y="170" font-family="serif" font-size="48" font-weight="900" fill="#1C2A39">Teacher Gui</text>
  <text x="250" y="200" font-family="monospace" font-size="20" font-weight="700" fill="#DDA15E" letter-spacing="4">BRITISH ENGLISH TUTOR</text>

  <!-- Title Headline -->
  <text x="140" y="300" font-family="serif" font-size="64" font-weight="900" fill="#1C2A39">Real English.</text>
  <text x="140" y="370" font-family="serif" font-size="64" font-weight="900" fill="#9E2A2B" font-style="italic">Real Connection.</text>

  <!-- Description -->
  <text x="140" y="440" font-family="sans-serif" font-size="24" fill="#1C2A39" opacity="0.8">
    Aulas particulares e em dupla • Online &amp; Presenciais • No seu ritmo, sem pressão
  </text>

  <!-- Badge stamp -->
  <rect x="880" y="420" width="200" height="50" rx="25" fill="#1C2A39"/>
  <text x="980" y="452" font-family="monospace" font-size="16" font-weight="bold" fill="#DDA15E" text-anchor="middle" letter-spacing="2">
    TEACHER GUI 🇬🇧
  </text>
</svg>
